<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png" />
    <title>Find your pet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id = "title">Вход</h2>

<select id="languageSwitcher">
    <option value="en">English</option>
    <option value="ru" selected>Русский</option>
</select>

<div>
    <span class="styled-text">Введите ваш email:</span>
    <input type="text" id="email" placeholder="Email">
</div>

<div>
    <span class="styled-text">Введите пароль:</span>
    <input type="password" id="password" placeholder="Пароль">
</div>

<button id="login" class="styled-text" >Войти</button>

<div class="error" id="errorMessage">Ошибка: Пожалуйста, заполните все поля.</div>
<p id="errorMessage" class="error"></p>

<script src="Login.js"></script>
</body>
</html>
