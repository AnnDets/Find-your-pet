<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png" />
    <title>Find your pet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>I found an animal</h2>

<div>
    <span class="styled-text">Attach a photo:</span>
    <span class="styled-redtext">*</span>
    <input type="file" id="photo" accept="image/*"/>
</div>

<div>
    <span class="styled-text">Nickname:</span>
    <input type="text" id="petname" placeholder="Nickname">
</div>

<div>
    <span class="styled-text">Color:</span>
    <span class="styled-redtext">*</span>
    <input type="text" id="color" placeholder="color">
</div>

<div>
    <span class="styled-text">Breed:</span>
    <input type="text" id="breed" placeholder="Breed">
</div>

<div>
    <span class="styled-text">Pet:</span>
    <span class="styled-redtext">*</span>
    <select id="pet">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="other">other</option>
    </select>
    <input type="text" id="pet" placeholder="pet">
</div>

<div>
    <span class="styled-text">Пол:</span>
    <span class="styled-redtext">*</span>
    <select id="gender">
        <option value="boy">Мальчик</option>
        <option value="girl">Девочка</option>
        <option value="other">Другое</option>
    </select>
</div>

<div>
    <span class="styled-text">Date of location:</span>
    <span class="styled-redtext">*</span>
    <input type="date" id="finddate" placeholder="Date of location">
</div>

<div>
    <span class="styled-text">Availability of accessories:</span>
    <span class="styled-redtext">*</span>
    <select id="accessory">
        <option value="no">NO</option>
        <option value="yes">YES</option>
    </select>
    <input type="text" id="accessory" placeholder="accessory">
</div>

<div>
    <span class="styled-text">Additional information:</span>
    <input type="text" id="info" placeholder="Additional information">
</div>

<div>
    <span class="styled-redtext">Fields with * are required</span>
</div>

<button id="safe" class="styled-text">Save</button>

<div class="error" id="errorMessage">Error: Please fill out all fields.</div>

<p id="errorMessage" class="error"></p>

<script src="find.js"></script>
</body>
</html>
