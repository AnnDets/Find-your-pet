<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png" />
    <title>Find your pet</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <select id="languageSwitcher">
        <option value="en">English</option>
        <option value="ru" selected>Русский</option>
    </select>
    

<div class="box" id="one">
    <span class="styled-headtext">Заявка:</span>
    <div class="box" id="oneone">
        <input type="image" id="find" src="Lapa.png" alt="Кнопка «input»">
        <span class="styled-text">Я нашёл животное</span>
    </div>

    <div class="box" id="onetwo">
        <input type="image" id="lost" src="Lapa.png" alt="Кнопка «input»">
        <span class="styled-text">Я потерял животное</span>
    </div>
</div>

<div class="box" id="two">
    <button class="button" id="Login">Войти</button>
    <button class="button" id="Registration">Регистрация</button>
    <button class="button" id="Chat">Чат</button>
    <button class="button" id="Filter">Фильтр</button>
    <button class="button" id="Instruction">Инструкция по поиску</button>
    <button class="button" id="About_us">О нас</button>
</div>

<div class="box" id="three">
    <span class="styled-text">Счастливые найдёныши:</span>
    <div class="box" id="threeone">
        <button id="firstpetButton" class="image-button" style="background-image: url('one.jpg'); "></button>
        <button id="secondpetButton" class="image-button" style="background-image: url('two.jpg'); "></button>
        <button id="thirdpetButton" class="image-button" style="background-image: url('three.jpg'); "></button>
        <button id="fourpetButton" class="image-button" style="background-image: url('four.jpg'); "></button>
        <button id="fivepetButton" class="image-button" style="background-image: url('five.jpg'); "></button>                
    </div>
</div>

<div class="box" id="four">
    <span class="styled-text">О нас:</span>
    <span class="text">Мы команда....</span>
</div>

<script src="homeguest.js"></script>
</body>
</html>
